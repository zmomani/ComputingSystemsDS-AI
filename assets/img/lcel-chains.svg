<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6573"/></marker></defs><rect width="980" height="520" fill="#fff"/><text x="24" y="34" font-size="14" font-weight="700" fill="#1f3a5f">A chain: three components joined with the pipe operator |</text><rect x="24" y="56" width="150" height="64" rx="9" fill="#fff" stroke="#1f3a5f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="99.0" y="85.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14202e">Input</text><text x="99.0" y="104.0" text-anchor="middle" font-size="12" fill="#5b6573">{"language", "text"}</text><line x1="178" y1="88" x2="208" y2="88" stroke="#5b6573" stroke-width="1.8" marker-end="url(#a)"/><rect x="214" y="56" width="170" height="64" rx="9" fill="#eef3f8" stroke="#1f3a5f" stroke-width="1.6"/><text x="299.0" y="85.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14202e">Prompt template</text><text x="299.0" y="104.0" text-anchor="middle" font-size="12" fill="#5b6573">fills the placeholders</text><line x1="388" y1="88" x2="418" y2="88" stroke="#5b6573" stroke-width="1.8" marker-end="url(#a)"/><rect x="424" y="56" width="170" height="64" rx="9" fill="#eef3f8" stroke="#1f3a5f" stroke-width="1.6"/><text x="509.0" y="85.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14202e">Chat model</text><text x="509.0" y="104.0" text-anchor="middle" font-size="12" fill="#5b6573">writes a reply</text><line x1="598" y1="88" x2="628" y2="88" stroke="#5b6573" stroke-width="1.8" marker-end="url(#a)"/><rect x="634" y="56" width="150" height="64" rx="9" fill="#eef3f8" stroke="#1f3a5f" stroke-width="1.6"/><text x="709.0" y="85.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14202e">Output parser</text><text x="709.0" y="104.0" text-anchor="middle" font-size="12" fill="#5b6573">keeps the text</text><line x1="788" y1="88" x2="818" y2="88" stroke="#5b6573" stroke-width="1.8" marker-end="url(#a)"/><rect x="824" y="56" width="132" height="64" rx="9" fill="#fff" stroke="#1f3a5f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="890.0" y="85.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14202e">Output</text><text x="890.0" y="104.0" text-anchor="middle" font-size="12" fill="#5b6573">a string</text><text x="24" y="180" font-size="14" font-weight="700" fill="#1f3a5f">A sequential chain: the output of one chain is the input of the next</text><rect x="24" y="204" width="150" height="64" rx="9" fill="#fff" stroke="#1f3a5f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="99.0" y="233.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14202e">Input</text><text x="99.0" y="252.0" text-anchor="middle" font-size="12" fill="#5b6573">{"name"}</text><rect x="234" y="204" width="200" height="64" rx="9" fill="#fdf3e1" stroke="#e09f3e" stroke-width="1.6"/><text x="334.0" y="233.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14202e">HTML chain</text><text x="334.0" y="252.0" text-anchor="middle" font-size="12" fill="#5b6573">prompt | model | parser</text><rect x="520" y="204" width="200" height="64" rx="9" fill="#e4f4f1" stroke="#2a9d8f" stroke-width="1.6"/><text x="620.0" y="233.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14202e">Python chain</text><text x="620.0" y="252.0" text-anchor="middle" font-size="12" fill="#5b6573">prompt | model | parser</text><rect x="806" y="204" width="150" height="64" rx="9" fill="#fff" stroke="#1f3a5f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="881.0" y="233.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14202e">Output</text><text x="881.0" y="252.0" text-anchor="middle" font-size="12" fill="#5b6573">code + explanation</text><line x1="178" y1="236" x2="228" y2="236" stroke="#5b6573" stroke-width="1.8" marker-end="url(#a)"/><line x1="438" y1="236" x2="514" y2="236" stroke="#5b6573" stroke-width="1.8" marker-end="url(#a)"/><text x="476.0" y="228.0" text-anchor="middle" font-size="12" fill="#5b6573" font-family="ui-monospace, Menlo, Consolas, monospace">code</text><line x1="724" y1="236" x2="800" y2="236" stroke="#5b6573" stroke-width="1.8" marker-end="url(#a)"/><text x="24" y="330" font-size="14" font-weight="700" fill="#1f3a5f">Several inputs and outputs: each step adds a key to one shared dictionary</text><rect x="24" y="356" width="170" height="120" rx="9" fill="#fff" stroke="#1f3a5f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="109" y="394" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#14202e" font-weight="400">name</text><line x1="200" y1="416" x2="392" y2="416" stroke="#5b6573" stroke-width="1.8" marker-end="url(#a)"/><text x="296.0" y="404" text-anchor="middle" font-size="12" fill="#5b6573" font-family="ui-monospace, Menlo, Consolas, monospace">assign(code=…)</text><rect x="398" y="356" width="170" height="120" rx="9" fill="#fff" stroke="#e09f3e" stroke-width="1.6" stroke-dasharray="6 4"/><text x="483" y="394" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#14202e" font-weight="400">name</text><text x="483" y="420" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#e09f3e" font-weight="700">code</text><line x1="574" y1="416" x2="780" y2="416" stroke="#5b6573" stroke-width="1.8" marker-end="url(#a)"/><text x="677.0" y="404" text-anchor="middle" font-size="12" fill="#5b6573" font-family="ui-monospace, Menlo, Consolas, monospace">assign(explanation=…)</text><rect x="786" y="356" width="170" height="120" rx="9" fill="#fff" stroke="#2a9d8f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="871" y="394" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#14202e" font-weight="400">name</text><text x="871" y="420" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#14202e" font-weight="400">code</text><text x="871" y="446" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#2a9d8f" font-weight="700">explanation</text><text x="490" y="504" text-anchor="middle" font-size="13" fill="#5b6573">Every value is still available at the end.</text></svg>